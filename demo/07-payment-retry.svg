<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501 340" width="501" height="340" role="img" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>Payment retry</title><desc>1. order → pg: authorize; 2. pg → order: timeout (실패); 3. order → pg: authorize (retry 1); 4. pg → order: 503 (실패); 5. order → pg: authorize (retry 2); 6. pg → order: approved; 7. order → ledger: record payment</desc><style>
  .bg{fill:var(--bg)} .node{fill:var(--node);stroke:var(--line);stroke-width:1.5}
  .nl{text-anchor:middle;dominant-baseline:central;font-size:15px;font-weight:600;fill:var(--fg)}
