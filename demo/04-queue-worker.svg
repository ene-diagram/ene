<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 467 287" width="467" height="287" class="ene ene-theme-default" role="img" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>Queue worker</title><desc>1. producer → queue: order.created; 2. worker → queue: poll; 3. queue → worker: message; 4. worker → mail: send confirmation; 5. worker → queue: delete; 6. worker → queue: poll; 7. queue → worker: message; 8. worker → mail: send confirmation; 9. worker → queue: delete; 10. worker → queue: poll; 11. queue → worker: message; 12. worker → mail: send confirmation; 13. worker → queue: delete</desc><style>
  .bg{fill:var(--bg)} .node{fill:var(--node);stroke:var(--line);stroke-width:1.5}
