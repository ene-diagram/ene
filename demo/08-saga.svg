<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 409" width="441" height="409" role="img" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>주문 사가와 보상 트랜잭션</title><desc>1. orch → order: 주문 생성; 2. order → orch: 생성됨; 3. orch → stock: 재고 차감; 4. stock → orch: 차감됨; 5. orch → pay: 결제; 6. pay → orch: 한도 초과 (실패); 7. orch → stock: 재고 복구 (보상); 7. orch → order: 주문 취소 (보상); 8. stock → orch: 복구됨</desc><style>
