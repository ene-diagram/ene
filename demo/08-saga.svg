<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 441 409" width="441" height="409" class="ene ene-theme-default" role="img" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>Order saga with compensation</title><desc>1. orch → order: create order; 2. order → orch: created; 3. orch → stock: reserve stock; 4. stock → orch: reserved; 5. orch → pay: charge; 6. pay → orch: limit exceeded (fail); 7. orch → stock: release stock (compensate) 7. orch → order: cancel order (compensate); 8. stock → orch: released</desc><style>
  .bg{fill:var(--bg)} .node{fill:var(--node);stroke:var(--line);stroke-width:1.5}
  .nl{text-anchor:middle;dominant-baseline:central;font-size:15px;font-weight:600;fill:var(--fg)}
  .edge{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:4 4}
  .hl{fill:none;stroke-width:2.5} .hl.ok{stroke:var(--ok)} .hl.fail{stroke:var(--fail)} .hl.reply{stroke:var(--reply);stroke-dasharray:7 5}
  .hl.async{stroke:var(--async);stroke-dasharray:1 5;stroke-linecap:round}
  .dot.ok{fill:var(--ok)} .dot.fail{fill:var(--fail)} .dot.reply{fill:var(--reply)} .dot.async{fill:var(--async)}
  .lbl{text-anchor:middle;font-size:12px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
  .x{text-anchor:middle;font-size:18px;font-weight:700;fill:var(--fail)}
  .t{font-size:17px;font-weight:700;fill:var(--fg)} .gl{font-size:12px;font-weight:600}
  .life{stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5} .frame{fill:var(--ok);fill-opacity:.04;stroke:var(--line);stroke-width:1.2}
  .fl{font-size:11px;font-weight:700;fill:var(--fg2)} .note{font-size:13px;fill:var(--fg2)}

  @media (prefers-reduced-motion: reduce){.dot,.x,.note{display:none}.hl,.lbl{opacity:1 !important}}
  svg.ene-theme-default{--bg:#fbfcfd;--node:#fff;--line:#c1c8d2;--faint:#d9dde3;--fg:#1c2024;--fg2:#3a4048;--ok:#3e63dd;--fail:#e5484d;--reply:#30a46c;--async:#8e4ec6}@media (prefers-color-scheme: dark){svg.ene-theme-default{--bg:#111113;--node:#1c1d21;--line:#3b3e45;--faint:#2e3036;--fg:#edeef0;--fg2:#b0b4ba;--ok:#7b9bff;--fail:#ff6369;--reply:#4cc38a;--async:#bf7af0}}</style><defs><marker id="ene-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" class="bg"/><text x="40" y="34" class="t">Order saga with compensation</text><g transform="translate(0 44)"><path id="e0" d="M178,91.2 Q247.3,85.4 318.3,160" class="edge"/><path id="e1" d="M288,165.1 Q226,141.5 177.4,123" class="edge"/><path id="e2" d="M145.8,123 Q233,184.7 316.4,262" class="edge"/><path id="e3" d="M288,266.5 Q195.3,231.3 125.7,123" class="edge"/><path id="e4" d="M178,75.2 Q224.3,60.5 288,73.1" class="edge"/><path id="e5" d="M288,101.4 Q227.7,120.5 178,110.6" class="edge"/><path id="e6" d="M116,123 Q157.5,277.9 288,285" class="edge"/><path id="e7" d="M133.7,123 Q204.7,197.6 288,190.6" class="edge"/><path id="e8" d="M288,297.2 Q119.7,324.5 110.2,123" class="edge"/><g><rect x="40" y="71" width="138" height="52" rx="10" class="node"/><text x="109" y="97" class="nl">Orchestrator</text></g><g><rect x="288" y="160" width="110" height="52" rx="10" class="node"/><text x="343" y="186" class="nl">Orders</text></g><g><rect x="288" y="262" width="113" height="52" rx="10" class="node"/><text x="344.5" y="288" class="nl">Inventory</text></g><g><rect x="288" y="58" width="110" height="52" rx="10" class="node"/><text x="343" y="84" class="nl">Payments</text></g><path d="M178,91.2 Q247.3,85.4 318.3,160" class="hl ok" marker-end="url(#ene-ah)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0000;0.0000;0.9730;1" dur="11.1s" repeatCount="indefini