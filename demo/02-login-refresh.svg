<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 444" width="650" height="444" class="ene ene-theme-default" role="img" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>Login and token refresh</title><desc>1. browser → auth: POST /login; 2. auth → users: verify password; 3. users → auth: OK; 4. auth → browser: access + refresh token; 5. browser → api: GET /me (expired token); 6. api → browser: 401 (fail); 7. browser → auth: POST /refresh; 8. auth → browser: new access token; 9. browser → api: GET /me; 10. api → browser: 200</desc><style>
  .bg{fill:var(--bg)} .node{fill:var(--node);stroke:var(--line);stroke-width:1.5}
  .nl{text-anchor:middle;dominant-baseline:central;font-size:15px;font-weight:600;fill:var(--fg)}
  .edge{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:4 4}
  .hl{fill:none;stroke-width:2.5} .hl.ok{stroke:var(--ok)} .hl.fail{stroke:var(--fail)} .hl.reply{stroke:var(--reply);stroke-dasharray:7 5}
  .hl.async{stroke:var(--async);stroke-dasharray:1 5;stroke-linecap:round}
  .dot.ok{fill:var(--ok)} .dot.fail{fill:var(--fail)} .dot.reply{fill:var(--reply)} .dot.async{fill:var(--async)}
  .lbl{text-anchor:middle;font-size:12px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
  .x{text-anchor:middle;font-size:18px;font-weight:700;fill:var(--fail)}
  .t{font-size:17px;font-weight:700;fill:var(--fg)} .gl{font-size:12px;font-weight:600}
  .life{stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5} .frame{fill:var(--ok);fill-opacity:.04;stroke:var(--line);stroke-width:1.2}
  .fl{font-size:11px;font-weight:700;fill:var(--fg2)} .note{font-size:13px;fill:var(--fg2)}

  @media (prefers-reduced-motion: reduce){.dot,.x,.note{display:none}.hl,.lbl{opacity:1 !important}}
  svg.ene-theme-default{--bg:#fbfcfd;--node:#fff;--line:#c1c8d2;--faint:#d9dde3;--fg:#1c2024;--fg2:#3a4048;--ok:#3e63dd;--fail:#e5484d;--reply:#30a46c;--async:#8e4ec6}@media (prefers-color-scheme: dark){svg.ene-theme-default{--bg:#111113;--node:#1c1d21;--line:#3b3e45;--faint:#2e3036;--fg:#edeef0;--fg2:#b0b4ba;--ok:#7b9bff;--fail:#ff6369;--reply:#4cc38a;--async:#bf7af0}}</style><defs><marker id="ene-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" class="bg"/><text x="40" y="34" class="t">Login and token refresh</text><g transform="translate(0 44)"><path id="e0" d="M101.5,181 Q146.3,359.1 283.2,274" class="edge"/><path id="e1" d="M390,231 Q440,218 500,233.7" class="edge"/><path id="e2" d="M500,262.3 Q440,278 390,265" class="edge"/><path id="e3" d="M260,271.1 Q168.8,303.5 107.9,181" class="edge"/><path id="e4" d="M130.4,181 Q211.3,240.4 290.4,172" class="edge"/><path id="e5" d="M260,164.7 Q208.9,180.5 150,167.3" class="edge"/><path id="e6" d="M122,181 Q191.3,247.9 260,247.9" class="edge"/><path id="e7" d="M273.1,222 Q213.7,192.2 150,172.2" class="edge"/><path id="e8" d="M150,138 Q206.6,120.5 260,132.5" class="edge"/><path id="e9" d="M285.1,120 Q204.2,60.6 125.1,129" class="edge"/><g><rect x="40" y="129" width="110" height="52" rx="10" class="node"/><text x="95" y="155" class="nl">Browser</text></g><g><rect x="260" y="222" width="130" height="52" rx="10" class="node"/><text x="325" y="248" class="nl">Auth Server</text></g><g><rect x="500" y="222" width="110" height="52" rx="10" class="node"/><text x="555" y="248" class="nl">Users DB</text></g><g><rect x="260" y="120" width="121" height="52" rx="10" class="node"/><text x="320.5" y="146" class="nl">API Server</text></g><path d="M101.5,181 Q146.3,359.1 283.2,274" class="hl ok" marker-end="url(#ene-ah)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTim