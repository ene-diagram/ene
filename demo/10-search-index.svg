<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1332 515" width="1332" height="515" role="img" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>검색 인덱싱 파이프라인</title><desc>1. app → db: 상품 수정; 2. db → cdc: binlog; 3. cdc → kafka: product-changed; 4. kafka → indexer: 소비; 5. indexer → es: 문서 갱신; 6. user → search: 검색; 7. search → es: query; 8. es → search: 결과; 9. search → user: 200</desc><style>
