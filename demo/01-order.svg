<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 641 398" width="641" height="398" role="img" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>Order request</title><desc>1. user → api: POST /order; 2. api → cache: check stock; 3. cache → api: miss; 4. api → db: SELECT stock; 4. api → pay: charge; 5. db → api: in stock; 6. pay → api: timeout (실패); 7. api → user: 502 retry later</desc><style>
