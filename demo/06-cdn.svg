<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 667 323" width="667" height="323" role="img" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>CDN cache</title><desc>1. browser → edge: GET /app.js; 2. edge → browser: 200 (cached); 3. edge → logs: access log</desc><style>
  .bg{fill:var(--bg)} .node{fill:var(--node);stroke:var(--line);stroke-width:1.5}
  .nl{text-anchor:middle;dominant-baseline:central;font-size:15px;font-weight:600;fill:var(--fg)}
  .edge{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:4 4}
  .hl{fill:none;stroke-width:2.5} .hl.ok{stroke:var(--ok)} .hl.fail{stroke:var(--fail)} .hl.reply{stroke:var(--reply);stroke-dasharray:7 5}
  .dot.ok{fill:var(--ok)} .dot.fail{fill:var(--fail)} .dot.reply{fill:var(--reply)}
  .lbl{text-anchor:middle;font-size:12px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
  .x{text-anchor:middle;font-size:18px;font-weight:700;fill:var(--fail)}
  .t{font-size:17px;font-weight:700;fill:var(--fg)} .gl{font-size:12px;font-weight:600}
  .life{stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5} .frame{fill:var(--ok);fill-opacity:.04;stroke:var(--line);stroke-width:1.2}
  .fl{font-size:11px;font-weight:700;fill:var(--fg2)}
  svg{--bg:#fbfcfd;--node:#fff;--line:#c1c8d2;--faint:#d9dde3;--fg:#1c2024;--fg2:#3a4048;--ok:#3e63dd;--fail:#e5484d;--reply:#30a46c}
  @media (prefers-color-scheme: dark){svg{--bg:#111113;--node:#1c1d21;--line:#3b3e45;--faint:#2e3036;--fg:#edeef0;--fg2:#b0b4ba;--ok:#7b9bff;--fail:#ff6369;--reply:#4cc38a}}
  @media (prefers-reduced-motion: reduce){.dot,.x{display:none}.hl,.lbl{opacity:1 !important}}</style><defs><marker id="ene-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" class="bg"/><text x="40" y="34" class="t">CDN cache</text><g transform="translate(0 44)"><path id="e0" d="M142.7,94 Q205,60 267.3,94" class="edge"/><path id="e1" d="M260,120 Q205,120 150,120" class="edge"/><path id="e2" d="M370,102.6 Q423.8,85.5 480,98.4" class="edge"/><path id="e3" d="M480,128.4 Q426.2,145.5 370,132.6" class="edge"/><path id="e4" d="M267.3,146 Q205,180 142.7,146" class="edge"/><path id="e5" d="M370,141.4 Q434.3,166.5 486.8,187" class="edge"/><g><rect x="40" y="94" width="110" height="52" rx="10" class="node"/><text x="95" y="120" class="nl">Browser</text></g><g><rect x="260" y="94" width="110" height="52" rx="10" class="node"/><text x="315" y="120" class="nl">CDN Edge</text></g><g><rect x="480" y="85" width="110" height="52" rx="10" class="node"/><text x="535" y="111" class="nl">Origin</text></g><g><rect x="480" y="187" width="147" height="52" rx="10" class="node"/><text x="553.5" y="213" class="nl">Log Collector</text></g><path d="M142.7,94 Q205,60 267.3,94" class="hl ok" marker-end="url(#ene-ah)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0000;0.0000;0.9412;1" dur="5.1s" repeatCount="indefinite"/></path><path d="M260,120 Q205,120 150,120" class="hl reply" marker-end="url(#ene-ah)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2353;0.2353;0.9412;1" dur="5.1s" repeatCount="indefinite"/></path><path d="M370,141.4 Q434.3,166.5 486.8,187" class="hl ok" marker-end="url(#ene-ah)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4706;0.4706;0.9412;1" dur="5.1s" repeatCount="indefinite"/></path><text x="205" y="71" class="lbl" opacity="0">1. GET /app.js<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0000;0.9412;0.9412;1" dur="5.1s" repeatCount="indefinite"/></text><text x="205" y="114" class="lbl" opacity="0">2. 200 (cached)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2353;0.2353;0.9412;0.9412;1" dur="5.1s" repeatCount="indefinite"/></text><text x="431.3" y="159.4" class="lbl" opacity="0">3. access log<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4706;0.4706;0.9412;0.9412;1" dur="5.1s" repeatCount="indefinite"/></text><circle r="7" class="dot ok" opacity="0"><animateMotion dur="5.1s" repeatCount="indefinite" keyPoints="0;0;0;1;1;1" keyTimes="0;0.0000;0.0000;0.2000;0.2000;1" calcMode="linear"><mpath href="#e0"/></animateMotion><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0000;0.2000;0.2098;1" dur="5.1s" repeatCount="indefinite"/></circle><circle r="7" class="dot reply" opacity="0"><animateMotion dur="5.1s" repeatCount="indefinite" keyPoints="0;0;0;1;1;1" keyTimes="0;0.2353;0.2353;0.4353;0.4353;1" calcMode="linear"><mpath href="#e1"/></animateMotion><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2353;0.2353;0.4353;0.4451;1" dur="5.1s" repeatCount="indefinite"/></circle><circle r="7" class="dot ok" opacity="0"><animateMotion dur="5.1s" repeatCount="indefinite" keyPoints="0;0;0;1;1;1" keyTimes="0;0.4706;0.4706;0.6706;0.6706;1" calcMode="linear"><mpath href="#e5"/></animateMotion><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4706;0.4706;0.6706;0.6804;1" dur="5.1s" repeatCount="indefinite"/></circle></g></svg>