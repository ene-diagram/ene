<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 280" width="372" height="280" role="img" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"><title>ene diagram</title><desc>1. user → api: login; 2. api → user: token</desc><style>
  .bg{fill:var(--bg)} .node{fill:var(--node);stroke:var(--line);stroke-width:1.5}
  .nl{text-anchor:middle;dominant-baseline:central;font-size:15px;font-weight:600;fill:var(--fg)}
  .edge{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:4 4}
  .hl{fill:none;stroke-width:2.5} .hl.ok{stroke:var(--ok)} .hl.fail{stroke:var(--fail)} .hl.reply{stroke:var(--reply);stroke-dasharray:7 5}
  .dot.ok{fill:var(--ok)} .dot.fail{fill:var(--fail)} .dot.reply{fill:var(--reply)}
  .lbl{text-anchor:middle;font-size:12px;fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
  .x{text-anchor:middle;font-size:18px;font-weight:700;fill:var(--fail)}
  .t{font-size:17px;font-weight:700;fill:var(--fg)} .gl{font-size:12px;font-weight:600}
  .life{stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5} .frame{fill:var(--ok);fill-opacity:.04;stroke:var(--line);stroke-width:1.2}
  .fl{font-size:11px;font-weight:700;fill:var(--fg2)}
  svg{--bg:#fbfcfd;--node:#fff;--line:#c1c8d2;--faint:#d9dde3;--fg:#1c2024;--fg2:#3a4048;--ok:#3e63dd;--fail:#e5484d;--reply:#30a46c}
  @media (prefers-color-scheme: dark){svg{--bg:#111113;--node:#1c1d21;--line:#3b3e45;--faint:#2e3036;--fg:#edeef0;--fg2:#b0b4ba;--ok:#7b9bff;--fail:#ff6369;--reply:#4cc38a}}
  @media (prefers-reduced-motion: reduce){.dot,.x{display:none}.hl,.lbl{opacity:1 !important}}</style><defs><marker id="ene-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" class="bg"/><g transform="translate(0 0)"><line x1="95" y1="92" x2="95" y2="240" class="life"/><line x1="265" y1="92" x2="265" y2="240" class="life"/><path id="s0_0" d="M99,136 L261,136" class="edge"/><path id="s1_0" d="M261,188 L99,188" class="edge"/><g><rect x="40" y="40" width="110" height="52" rx="10" class="node"/><text x="95" y="66" class="nl">user</text></g><g><rect x="210" y="40" width="110" height="52" rx="10" class="node"/><text x="265" y="66" class="nl">api</text></g><path d="M99,136 L261,136" class="hl ok" marker-end="url(#ene-ah)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0000;0.0000;0.9231;1" dur="3.9s" repeatCount="indefinite"/></path><path d="M261,188 L99,188" class="hl reply" marker-end="url(#ene-ah)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3077;0.3077;0.9231;1" dur="3.9s" repeatCount="indefinite"/></path><text x="180" y="130" class="lbl" opacity="0">1. login<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0000;0.9231;0.9231;1" dur="3.9s" repeatCount="indefinite"/></text><text x="180" y="182" class="lbl" opacity="0">2. token<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3077;0.3077;0.9231;0.9231;1" dur="3.9s" repeatCount="indefinite"/></text><circle r="7" class="dot ok" opacity="0"><animateMotion dur="3.9s" repeatCount="indefinite" keyPoints="0;0;0;1;1;1" keyTimes="0;0.0000;0.0000;0.2615;0.2615;1" calcMode="linear"><mpath href="#s0_0"/></animateMotion><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0000;0.2615;0.2744;1" dur="3.9s" repeatCount="indefinite"/></circle><circle r="7" class="dot reply" opacity="0"><animateMotion dur="3.9s" repeatCount="indefinite" keyPoints="0;0;0;1;1;1" keyTimes="0;0.3077;0.3077;0.5692;0.5692;1" calcMode="linear"><mpath href="#s1_0"/></animateMotion><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3077;0.3077;0.5692;0.5821;1" dur="3.9s" repeatCount="indefinite"/></circle></g></svg>